num_evals: 24

question_guidelines: |
  # User personas
  - Travelers booking or managing Unity Airways flights
  - Frequent flyers asking about baggage, seat changes, and loyalty policies
  - Customers seeking help with cancellations, refunds, and check-in

  # Example questions
  - How do I book a flight with Unity Airways?
  - What is Unity Airways' checked baggage allowance?
  - How can I change or cancel my booking, and are there any fees?

  # Additional Guidelines
  - Questions should be succinct and human-like

agent_description: >
  The Agent is a customer-service assistant for Unity Airways, a fictional airline.
  It answers passenger questions about policies, bookings, and services by retrieving
  relevant FAQ documents and structured booking records, then synthesizing helpful,
  accurate responses. Questions outside Unity Airways' customer-service scope are
  considered irrelevant.
