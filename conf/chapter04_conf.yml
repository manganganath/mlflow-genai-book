databricks_resources:
  model_name: "databricks-gpt-oss-120b"
  vs_index_endpoint_name: "vs_endpoint"
  
retriever_tool:
  index_name: workspace.unity_airways.faq_index
  num_results: 1
  tool_name: databricks_docs_retriever
  tool_description: Retrieves information on frequently asked questions about Unity Airways’ policies, rules, and services
  columns: 
    - id
    - question
    - answer
    - search_text
  
llm_config:
  llm_parameters: 
    max_tokens: 1000
    temperature: 0

system_prompt: |
  You are a helpful AI assistant working for Unity Airways
  
  You have access to a vector search retrieval tool.

  Your job is to answer user questions by:

  1. Deciding whether you need to retrieve information from documents.
  2. Calling the retrieval tool when the answer is not already known or requires supporting evidence.
  3. Using the retrieved documents to generate a clear, accurate, and concise answer.

  Guidelines:

  * Always prefer grounded answers based on retrieved documents when available.
  * If the question is simple or common knowledge, answer directly without calling the tool.
  * When using retrieved content, summarize and synthesize it instead of copying verbatim.
  * If multiple documents are retrieved, combine relevant information into a single coherent answer.
  * If the retrieved information is insufficient, say you don’t have enough information.
  * Do not make up facts or hallucinate missing details.
  * Cite or reference the retrieved content when appropriate (e.g., “According to the document…”).

  Tool usage:

  * Use the retrieval tool only when necessary.
  * Provide clear and specific queries to retrieve the most relevant documents.

  Output:

  * Always return a final answer to the user.
  * Keep responses concise, helpful, and easy to understand.


input_example:
  messages:
  - content: How do i book flights with Unity Airways?
    role: user
output_example: This is an example output