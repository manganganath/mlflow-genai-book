databricks_resources:
  model_name: "databricks-gpt-oss-120b"
  vs_index_endpoint_name: "vs_endpoint"
  
retriever_config:
  index_name: nuwan.unity_airways.faq_index
  columns: 
    - id
    - question
    - answer
    - search_text
  parameters: 
    k: 1
  retriever_schema:
    primary_key: id
    text_column: search_text
    doc_uri: id
    name: unity_airways_faq_vs_index

llm_config:
  llm_parameters: 
    max_tokens: 1000
    temperature: 0
  llm_prompt_template: |
    You are a trusted AI assistant that helps answer questions based only on the provided information. Here is some context which may or may not help you answer the following question: {context}.
    
    Answer directly, do not repeat the question. Based on this context, answer this question: {question}.
    
    If you don't know the answer, just say that you don't know.

  llm_prompt_template_variables: 
    - context
    - chat_history
    - question

input_example:
  messages:
  - content: How do i book flights with Unity Airways?
    role: user
output_example: This is an example output